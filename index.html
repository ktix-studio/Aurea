<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUREA — We Craft Legacies</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,100;6..96,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FAF6EB;color:#121212;font-family:'Inter',sans-serif;overscroll-behavior:none}
#webgl{position:fixed;inset:0;width:100%;height:100vh;z-index:0}
nav{position:fixed;top:0;width:100%;z-index:10;padding:20px 36px;display:flex;justify-content:space-between;align-items:center;background:rgba(250,246,235,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(200,169,106,.2)}
.logo{font-family:'Bodoni Moda';letter-spacing:8px;font-size:11px;font-weight:600}.logo span{font-family:'Instrument Serif';font-style:italic;letter-spacing:1px;color:#C8A96A;margin-left:8px;text-transform:none;font-size:12px}
a.btn{border:1px solid #121212;padding:10px 18px;font-size:8px;letter-spacing:4px;text-transform:uppercase;text-decoration:none;color:#121212}
.progress{position:fixed;top:0;left:0;height:2px;background:#C8A96A;z-index:20;width:0%}
.hero{position:relative;z-index:2;width:100%;height:100vh;pointer-events:none}
.hero-text{position:absolute;left:44px;bottom:48px;max-width:480px}
.h1{font-family:'Bodoni Moda';font-size:clamp(48px,6vw,78px);line-height:.85;font-weight:100;letter-spacing:-1px}
.h1 i{font-family:'Instrument Serif';font-style:italic;color:#C8A96A;display:block}
.scroll-hint{margin-top:24px;font-size:9px;letter-spacing:5px;text-transform:uppercase;opacity:.5;display:flex;gap:10px;align-items:center}
.scroll-hint::before{content:'';width:40px;height:1px;background:#C8A96A}
.spacer{height:350vh}
.sec{position:relative;z-index:2;background:#FAF6EB;padding:100px 44px;border-top:1px solid rgba(200,169,106,.2)}
.h2{font-family:'Bodoni Moda';font-size:48px;font-weight:100;line-height:.9;max-width:600px}
.h2 i{font-family:'Instrument Serif';font-style:italic;color:#C8A96A}
@media(max-width:700px){.hero-text{left:20px;right:20px;bottom:30px}nav{padding:16px 20px}.sec{padding:60px 20px}}
</style>
</head>
<body>
<div class="progress" id="bar"></div>
<canvas id="webgl"></canvas>
<nav><div class="logo">AUREA <span>Architecture Atelier</span></div><a class="btn" href="../">Portfolio</a></nav>

<div class="hero">
  <div class="hero-text">
    <h1 class="h1">We don't build<br>houses.<br><i>We craft legacies.</i></h1>
    <div class="scroll-hint">Scroll to build the house — swipe up/down</div>
  </div>
</div>
<div class="spacer"></div>
<div class="sec">
  <h2 class="h2">From <i>foundation</i> to <i>roof</i> — built on scroll.</h2>
  <p style="margin-top:20px;opacity:.5;line-height:1.7;max-width:400px;font-size:13px">No ugly boxes. Just pure 3D. This is what you asked — house builds automatically when you scroll. Rate this now.</p>
</div>

<script>
gsap.registerPlugin(ScrollTrigger);
const bar=document.getElementById('bar');
const canvas=document.getElementById('webgl');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xFAF6EB);
const camera=new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 100);
camera.position.set(5,2.6,5.2);
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

// BRIGHT LUXURY LIGHTS — no dark house now
scene.add(new THREE.AmbientLight(0xffffff,1.15));
const hemi=new THREE.HemisphereLight(0xFFF8E3, 0xE8D5A5, 0.9);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.9);
sun.position.set(4,6,3);
scene.add(sun);

const house=new THREE.Group();
scene.add(house);

// MATERIALS — CREAM LUXURY, NOT GREY
const cream=new THREE.MeshStandardMaterial({color:0xFFF6DE, roughness:0.65, metalness:0.04});
const cream2=new THREE.MeshStandardMaterial({color:0xF5EAC8, roughness:0.6});
const brass=new THREE.MeshStandardMaterial({color:0xD6B07A, roughness:0.32, metalness:0.65});

function box(w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  m.scale.y=0.001;
  m.position.y-=h/2; // so it grows up from ground
  house.add(m);
  return m;
}

// BUILD ORDER
const base=box(4.6,0.5,3.2,brass,0,-0.7,0);
const wallL=box(0.12,1.6,2.1,cream,-1.85,0,0);
const wallR=box(0.12,1.6,2.1,cream,1.85,0,0);
const wallB=box(3.8,1.6,0.12,cream,0,0,-1.05);
const block1=box(1.2,0.95,1.0,cream2,-0.9,0,0.55);
const block2=box(1.3,1.15,1.1,cream,1.0,0,0.45);
const blockMid=box(0.9,0.7,0.9,cream2,-0.7,0,0.1);
const roof=box(4.1,0.28,2.9,cream2,0,0,0);
roof.scale.y=1;
roof.position.y=4; // starts high in sky

// GOLD DUST — luxury feel
const dustG=new THREE.BufferGeometry();
const N=140; const p=new Float32Array(N*3);
for(let i=0;i<N*3;i++) p[i]=(Math.random()-0.5)*9;
dustG.setAttribute('position', new THREE.BufferAttribute(p,3));
const dust=new THREE.Points(dustG, new THREE.PointsMaterial({color:0xFFD98A,size:0.055,transparent:true,opacity:0.75}));
house.add(dust);

// SCROLL BUILD TIMELINE — THIS IS WHAT YOU ASKED
const tl=gsap.timeline({
  scrollTrigger:{
    trigger:".spacer",
    start:"top top",
    end:"bottom bottom",
    scrub:1.2,
    onUpdate:s=>{bar.style.width=(s.progress*100)+"%";}
  }
});

// 0% -> 20% : GOLD BASE BUILDS
tl.to(base.scale,{y:1,duration:1,ease:"power2.out"},0)
 .to(base.position,{y:-0.45,duration:1},0)
// 20% -> 40% : OUTER WALLS GROW UP
 .to([wallL.scale,wallR.scale,wallB.scale],{y:1,duration:1.2,stagger:0.1,ease:"power2.out"},0.4)
 .to([wallL.position,wallR.position,wallB.position],{y:0.8,duration:1.2,stagger:0.1},0.4)
// 40% -> 60% : INNER BLOCKS
 .to([block1.scale,block2.scale,blockMid.scale],{y:1,duration:1,stagger:0.15,ease:"back.out(1)"},1.0)
 .to([block1.position,block2.position,blockMid.position],{y:0.55,duration:1,stagger:0.15},1.0)
// 60% -> 85% : ROOF DROPS FROM SKY
 .to(roof.position,{y:1.75,duration:1.2,ease:"power3.inOut"},1.8)
// 85% -> 100% : FINAL LUXURY ROTATION
 .to(house.rotation,{y:Math.PI*0.15,duration:1},2.2);

let mx=0;
addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-0.5);});

(function render(){
  requestAnimationFrame(render);
  house.rotation.y+= (mx*0.5 - house.rotation.y*0.01)*0.02;
  house.position.y=Math.sin(Date.now()*0.0005)*0.04;
  dust.rotation.y+=0.0008;
  camera.lookAt(0,0.6,0);
  renderer.render(scene,camera);
})();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
